plugins {
    id 'com.android.library'
}

android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        // Shared code remains compile-compatible with the CR-V Android 4.4 application.
        minSdk = 17
        targetSdk = 28
    }

    lint {
        abortOnError true
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    // Upstream shared-core dependencies.
    implementation libs.jmdns

    // Car App APIs are needed to compile the complete upstream tree but are not part of the
    // CR-V API19 runtime surface. Keep them off the legacy APK runtime dependency graph.
    compileOnly libs.androidx.app

    // CR-V/legacy transport crypto stack.
    implementation libs.bouncycastle
    implementation libs.bctls

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.app
}

