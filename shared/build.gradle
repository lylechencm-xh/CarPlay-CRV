plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 17
        targetSdk = 28
    }

    lint {
        abortOnError true
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

// Keep complete upstream source files in the repository, but exclude upstream-only Kotlin
// features from CR-V/API19 compilation. Android's java.exclude() does not affect Kotlin sources,
// so apply the patterns directly to every Kotlin compile task.
def crvExcludedKotlin = [
    '**/com/shilapi/xcertplay/adb/**',
    '**/com/shilapi/xcertplay/hud/**',
    '**/com/shilapi/xcertplay/network/CarPlayBonjour.kt',
    '**/com/shilapi/xcertplay/network/LocalOnlyHotspotManager.kt',
    '**/com/shilapi/xcertplay/network/ManualHotspotInterfaces.kt',
    '**/com/shilapi/xcertplay/network/WifiP2pGroupManager.kt',
    '**/com/shilapi/xcertplay/orchestration/CarPlayController.kt',
    '**/com/shilapi/xcertplay/shared/MyCarAppScreen.kt',
    '**/com/shilapi/xcertplay/shared/MyCarAppService.kt',
    '**/com/shilapi/xcertplay/shared/MyCarAppSession.kt',
    '**/com/shilapi/xcertplay/media/AndroidMediaSink.kt',
    '**/com/shilapi/xcertplay/mfi/RemoteMfiAuthenticationClient.kt',
]

tasks.configureEach { task ->
    if (task.name.toLowerCase().contains('kotlin') && task.hasProperty('source')) {
        task.exclude(crvExcludedKotlin)
    }
}

dependencies {
    implementation libs.bouncycastle
    implementation libs.bctls
    testImplementation libs.junit
    testImplementation libs.robolectric
}
