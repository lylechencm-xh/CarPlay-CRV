name: Import upstream DiPlay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-upstream.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream source
        run: |
          git clone --depth 1 https://github.com/shihabal3amri/DiPlay.git /tmp/diplay-upstream

      - name: Import missing upstream files
        run: |
          rsync -a --ignore-existing \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            /tmp/diplay-upstream/ ./

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No files to import."
            exit 0
          fi
          git commit -m "Import upstream DiPlay source snapshot"
          git push origin HEAD:main
