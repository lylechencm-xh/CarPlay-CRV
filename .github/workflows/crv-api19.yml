name: CR-V API19 build

on:
  push:
    branches: [main]
    paths:
      - "crvlegacy/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "build.gradle.kts"
      - ".github/workflows/crv-api19.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build CR-V Android 4.4 APK
        run: ./gradlew :crvlegacy:assembleDebug --stacktrace
      - name: Upload CR-V debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crv-api19-debug
          path: crvlegacy/build/outputs/apk/debug/*.apk
