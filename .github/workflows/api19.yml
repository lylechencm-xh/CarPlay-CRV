name: API19 Legacy Build
on:
  push:
    branches: [legacy-api19]

concurrency:
  group: api19-legacy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Run upstream wired-core tests
        run: gradle :shared:testDebugUnitTest --stacktrace
      - name: Lint CR-V API19 path
        id: lint
        continue-on-error: true
        run: gradle :shared:lintDebug :mobile:lintDebug --stacktrace
      - name: Print lint errors
        if: always()
        run: |
          for report in shared/build/reports/lint-results-debug.txt mobile/build/reports/lint-results-debug.txt; do
            if [ -f "$report" ]; then
              echo "===== $report ====="
              grep -n -E "Error:|Warning:" "$report" || true
            fi
          done
      - name: Build CR-V API19 APK
        run: gradle :mobile:assembleDebug --stacktrace
      - name: Upload CR-V API19 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-CRV-api19-debug
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
