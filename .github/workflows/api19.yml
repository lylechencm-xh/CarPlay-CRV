name: API19 Legacy Build
on:
  push:
    branches: [legacy-api19]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build legacy APK
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleDebug --stacktrace
